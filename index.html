<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Simulador Turístico: Case Study and Simulation</title><meta name="description" content="Simulador estratégico y auditor de evaluación por fases para Administración de Empresas Turísticas">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f7;--ink:#10272f;--card:#fff;--line:#c9d9de;--acc:#0b7285;--hot:#d9480f;--mut:#58727d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1b20;--ink:#e6f1f4;--card:#14282f;--line:#274650;--acc:#3bc9db;--hot:#ff922b;--mut:#8fb0ba}}
:root[data-theme=dark]{--bg:#0d1b20;--ink:#e6f1f4;--card:#14282f;--line:#274650;--acc:#3bc9db;--hot:#ff922b;--mut:#8fb0ba}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:2rem;font-weight:800;margin:.2em 0}h2{font-size:1.25rem;margin:1.2em 0 .3em}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--acc);color:#fff;padding:10px 14px;border-radius:10px;flex-wrap:wrap}
.bar b{font-weight:800}#cd{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.vs{display:flex;gap:8px;font-size:.9rem;color:var(--mut)}
label{display:block;font-weight:600;margin:12px 0 4px}
textarea,select,input{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
button{font:inherit;font-weight:600;background:var(--hot);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:14px}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-size:.92rem}
.sc{font-size:4rem;font-weight:800;line-height:1}.ok{color:var(--acc)}.no{color:var(--hot)}.s{color:var(--mut);font-size:.9rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.g{grid-template-columns:1fr}}
.sw{overflow-x:auto}details{margin:12px 0}summary{cursor:pointer;font-weight:600}a{color:var(--acc)}
</style></head><body><main id="app"></main>
<script>
const T=[
{n:"Grupo Posadas",m:"Cadena hotelera urbana y de playa en México (Live Aqua, Fiesta Americana, Fiesta Inn, One). Alta dependencia de comercialización digital y OTAs.",er:[8500,4250,2550,1700,255],bg:[2100,12500,11800,2800],k:"Ocupación 64% · ADR $2,450 · RevPAR $1,568 · Canales: 45% directa, 40% OTAs, 15% agencias/MICE",cs:"Crisis reputacional masiva por ciberataque o huelga de personal en temporada alta.",d:[1,[0]],p:[0,[1]],pf:[[4],[0]]},
{n:"Grupo Xcaret",m:"Integración vertical en Riviera Maya: parques de aventura, tours, transporte y hoteles All-Fun Inclusive. Fuerte CAPEX y conservación.",er:[11200,4480,3360,3360,1120],bg:[3500,18000,13500,8000],k:"5.5 M visitantes/año · Ocupación hotelera 82% · Gasto promedio $1,950 · Canales: 60% web directa, 25% mayoristas, 15% receptivos",cs:"Emergencia ecológica severa (plaga marina) que paraliza parques y playas por 3 semanas.",d:[1,[0]],p:[0,[1]],pf:[[0],[1,2]]},
{n:"Meliá Hotels Int. México",m:"Operación hotelera asset-light (administra propiedades de terceros) enfocada en lujo y turismo MICE.",er:[4600,2300,1380,920,368],bg:[1400,3200,3100,1500],k:"Ocupación 68% · ADR $3,100 · RevPAR $2,108 · Canales: 35% corporativo/GDS, 30% plataformas MICE, 20% OTAs, 15% lealtad",cs:"Crisis reputacional masiva por ciberataque o huelga de personal en temporada alta.",d:[1,[0]],p:[0,[1]],pf:[[4],[0]]},
{n:"Viajes El Corte Inglés / BCD Travel",m:"Gestión de viajes de negocios y DMC. Ingresos por comisiones y management fees; baja inversión en activo fijo.",er:[2100,1050,735,315,126],bg:[1800,400,1400,800],k:"TTV $14,000 mdp · Ticket promedio $18,500 · Retención 88% · Canales: 70% B2B, 20% autoreserva (OBT), 10% presencial",cs:"Cancelación masiva de vuelos corporativos por contingencia internacional o falla global de GDS.",d:[2,[3]],p:[0,[3]],pf:[[2],[1,4]]},
{n:"Cooperativa Trajineras de Xochimilco",m:"Empresa turística comunitaria y patrimonial: recorridos en embarcaciones tradicionales, gastronomía y chinampas.",er:[120,60,36,24,12],bg:[15,45,10,50],k:"600,000 visitantes/año · Gasto promedio $200 · 75% de la demanda en fines de semana y festivos · Canales: 65% embarcadero, 25% guías locales, 10% agencias",cs:"Contingencia ambiental por contaminación del canal o restricción sanitaria gubernamental.",d:[3,[0]],p:[3,[0]],pf:[[2],[0,1]]}];
const EJ=["Político","Económico","Social","Tecnológico","Ecológico","Legal"],RZ=["Liquidez","Solvencia / Endeudamiento","Margen EBITDA","Operación / Rotación"],PF=["Rivalidad entre competidores","Nuevos entrantes","Productos sustitutos","Poder de proveedores","Poder de clientes"],LV=["Baja","Media","Alta"],NV=["Corporativo","De negocios","Funcional"],EE=["Adaptación","Diversificación","Innovación","Colaboración","Diferenciación"];
const PX=[/gobierno|ley|regulaci|polític|impuesto|norma|elecci|permiso|seguridad/,/inflaci|tipo de cambio|dólar|econom|pib|tasa|costos|precios|recesi|empleo|ingreso/,/social|cultur|demogr|turista|consumidor|comunidad|generaci|hábito|tendencia/,/tecnolog|digital|inteligencia artificial|\bia\b|automatiz|app|plataforma|ciber|online|datos/,/ambient|ecol|clima|sostenib|huracán|sargazo|contaminaci|carbono|natural/,/legal|jurídic|normativ|contrato|licencia|derecho|sanci|cumplimiento/];
const NC=[/ansoff|penetraci|desarrollo de mercado|desarrollo de producto|diversificaci|estabilidad|crecimiento|contracci|adquisici|fusi|integraci|reestructura|desinversi/,/liderazgo en costos|diferenciaci|enfoque|nicho|alianza|joint|cooperativ|coopetici|cadena de valor|ventaja competitiva|franquicia/,/marketing|campaña|financ|operaci|recursos humanos|capacitaci|inventario|presupuesto|reclut|proceso|protocolo|promoci/];
const EC=[/adapt|ajust|flexib|reconfigur/,/diversific|nuevo|ampliar/,/innov|tecnolog|digital|app|automatiz/,/alianza|colabor|convenio|cooperaci|joint|socio/,/diferencia|exclusiv|marca|premium|valor agregado|autent/];
const MAT=`<details class="c"><summary>Materiales de consulta</summary><ul><li><a href="https://docs.google.com/spreadsheets/d/1Q4kAZMKr60N_5UyxogR_0_14uYYNVb6JhydH8lSHxYM/edit?usp=sharing" target="_blank" rel="noopener">Base de Noticias (PESTEL)</a></li><li><a href="https://reports.weforum.org/docs/GRR26_Press_Release_Spanish.pdf" target="_blank" rel="noopener">Reporte de Riesgos Globales 2026 (WEF)</a></li><li><a href="https://www.oecd.org/content/dam/oecd/en/publications/reports/2026/06/oecd-tourism-trends-and-policies-2026_13326fe2/3fd3cd75-en.pdf" target="_blank" rel="noopener">Tendencias y políticas de turismo 2026 (OECD)</a></li></ul></details>`;
const IA=[25,20,21,16],K="gia2",PW={g2:"60a96bbf2fdff3dc22a9aaee4db6128603352fff58795fb51147e6d004a6d981",g3:"e7dbfb6c8711a14efb75455f030ad035fcf1c677aca903bd52b24ec46e6f3be7"},DUR=30*60000;
let S={tm:0,nm:"",ph:0,end:0,a:{}},SL={},tk;
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const W=s=>(s||"").trim().split(/\s+/).filter(Boolean).length,X=(s,r)=>r.test((s||"").toLowerCase()),A=k=>S.a[k]||"";
const sv=e=>{S.a[e.id]=e.value;save()};
const o=(id,opts)=>{SL[id]=opts;return`<select id="${id}" onchange="sv(this)"><option value="">Elige…</option>${opts.map((x,i)=>`<option value="${i}"${A(id)===String(i)?" selected":""}>${x}</option>`).join("")}</select>`};
const ta=(id,lab,ph,r=3)=>`<label for="${id}">${lab}</label><textarea id="${id}" rows="${r}" placeholder="${ph||""}" oninput="sv(this)">${esc(A(id))}</textarea>`;
const f$=n=>"$"+n.toLocaleString("es-MX");
function ficha(t){const[e,c,g,b,u]=t.er,[ac,af,ps,cc]=t.bg;return`<div class="c"><b>${t.n}</b><p>${t.m}</p><div class="sw"><table><tr><th>Estado de resultados (mdp)</th><th>Balance (mdp)</th></tr><tr><td>Ingresos ${f$(e)} · Costo operación ${f$(c)} · Gastos ${f$(g)}<br>EBITDA ${f$(b)} (${Math.round(b/e*100)}%) · Utilidad neta ${f$(u)} (${Math.round(u/e*100)}%)</td><td>Activo circulante ${f$(ac)} · Activo fijo ${f$(af)}<br>Pasivo total ${f$(ps)} · Capital ${f$(cc)}</td></tr></table></div><p class="s">${t.k}<br>Pasivo/Activo total: ${Math.round(ps/(ac+af)*100)}% · Activo circulante/Pasivo total: ${(ac/ps).toFixed(2)}</p></div>`}
function P1(){let h=`<h2>Fase 1 · Diagnóstico estratégico y financiero</h2>${ficha(T[S.tm-1])}<h2>a) PESTEL (3 factores críticos, apóyense en la Base de Noticias)</h2>`;
for(let i=1;i<=3;i++)h+=`<div class="g"><div><label>Eje del factor ${i}</label>${o("pe"+i+"e",EJ)}</div><div>${ta("pe"+i+"t","Justificación con noticia","Según la noticia…, esto impacta a la empresa porque…",3)}</div></div>`;
return h+`<h2>b) 5 Fuerzas de Porter</h2><label>Mayor amenaza para el modelo de negocio</label>${o("pf",PF)}${ta("pft","¿Por qué?","",2)}<h2>c) VRIO y Cadena de Valor</h2>${ta("vr","Recurso o competencia distintiva: ¿es valioso, raro, difícil de imitar y explotado por la organización?","",3)}<h2>d) Diagnóstico financiero cualitativo</h2><label>Razón con mayor vulnerabilidad</label>${o("dx",RZ)}${ta("dxt","Interpreten los datos de la ficha","",3)}<h2>e) FODA cruzada</h2><div class="g">${ta("fo","FO (fortaleza + oportunidad)","",2)}${ta("fa","FA (fortaleza + amenaza)","",2)}${ta("do","DO (debilidad + oportunidad)","",2)}${ta("da","DA (debilidad + amenaza)","",2)}</div>`}
function P2(){const t=T[S.tm-1];return`<h2>Fase 2 · Prospectiva y Cisne Negro</h2><div class="c" style="border-color:var(--hot)"><b class="no">¡Evento disruptivo!</b><p>${t.cs}</p></div>${ta("tend","a) Mapa de tendencias afectadas (apóyense en el archivo de Tendencias)","",3)}<h2>b) Matriz de riesgos del evento</h2><div class="g"><div><label>Probabilidad</label>${o("prob",LV)}</div><div><label>Impacto</label>${o("imp",LV)}</div></div>${ta("rk","Justifiquen su ubicación en la matriz y cómo mitigarían el riesgo","",3)}<h2>c) Plan de resiliencia inmediato</h2><label>Razón financiera que será su PALANCA de solución</label>${o("pl",RZ)}${ta("pt","Acciones inmediatas","",4)}`}
function P3(){let h=`<h2>Fase 3 · Formulación estratégica y cierre</h2>${ta("ob","a) Objetivo estratégico SMART para superar el evento y recuperar KPIs (RevPAR / ocupación / EBITDA)","Recuperar … al X% en N meses…",3)}<h2>b) Estrategias: clasificación tridimensional</h2>`;
for(let i=1;i<=3;i++)h+=`${ta("s"+i+"t","Estrategia "+i,"",2)}<div class="g"><div><label>Nivel</label>${o("s"+i+"n",NV)}</div><div><label>Eje</label>${o("s"+i+"e",EE)}</div></div>`;
return h+`${ta("pj","c) Proyección cualitativa de la mejora en indicadores financieros","",3)}${ta("ag","d) ¿Por qué su plan SUPERA a la solución de la IA?","",4)}`}
function grade(){const a=A,n=k=>Number(a(k)),t=T[S.tm-1];let c=[0,0,0,0];
for(let i=1;i<=3;i++){const x=a("pe"+i+"t"),e=a("pe"+i+"e");c[0]+=(W(x)>=10)+(e!==""&&X(x,PX[+e]))+X(x,/noticia|según|fuente|reporta|publicó|base de/)}
const m=(k,full,part,p)=>a(k)===""?0:full.includes?.(n(k))||full===n(k)?p:part.includes(n(k))?p/2:0;
c[0]+=m("pf",t.pf[0],t.pf[1],3)+(W(a("pft"))>=10)*2+Math.min(3,["valios","raro|escas","imit","organiza"].filter(r=>X(a("vr"),new RegExp(r))).length)+(W(a("vr"))>=10);
c[0]+=m("dx",t.d[0],t.d[1],5)+(W(a("dxt"))>=10)*1.5+X(a("dxt"),/liquidez|deuda|endeud|margen|ebitda|pasivo|activo|ingreso|estacional/)*1.5;
["fo","fa","do","da"].forEach(k=>c[0]+=W(a(k))>=6);
c[1]=(W(a("tend"))>=12)*3+X(a("tend"),/tendencia|turismo|digital|sostenib|experiencia|bienestar|ia/)*3+(a("prob")==="0")*2+(a("imp")==="2")*2+(W(a("rk"))>=10)*2+X(a("rk"),/riesgo|mitig|probabil|impacto|control|reducir/)*3+m("pl",t.p[0],t.p[1],5)+(W(a("pt"))>=15)*2+X(a("pt"),/continuidad|protocolo|comunicaci|reserva|caja|crédito|seguro|diversific|plan de|crisis|alianza/)*3;
const ob=a("ob");c[2]=(W(ob)>=8)+X(ob,/^(aumentar|incrementar|recuperar|reducir|lograr|alcanzar|mejorar|generar|restablecer|disminuir|elevar|diversificar|implementar|consolidar)/)+/\d/.test(ob)*3+X(ob,/revpar|ocupaci|ebitda|ventas|ingresos|visitantes|retenci|adr|margen/)*2+X(ob,/mes|día|semana|trimestre|año|202\d|antes del|para el/)*3;
for(let i=1;i<=3;i++){const x=a("s"+i+"t"),l=a("s"+i+"n"),e=a("s"+i+"e");if(W(x)<6)continue;const hit=NC.map(r=>X(x,r));c[2]+=l===""?0:hit[+l]?3:hit.some(Boolean)?.5:1.5;c[2]+=e===""?0:X(x,EC[+e])?2:1}
const ag=a("ag"),cn=[/pestel/,/porter/,/vrio|cadena de valor/,/cisne negro/,/liquidez|solvencia|endeud|ebitda|razón|razones/,/smart/,/resiliencia|adaptabilidad|continuidad/,/sostenib|innovaci|responsabilidad social/].filter(r=>X(ag,r)).length;
c[3]=(W(a("pj"))>=12)*2+(X(a("pj"),/mejor|recuper|aument|increment|reduc/)&&X(a("pj"),/revpar|ocupaci|ebitda|ventas|ingresos|visitantes|retenci|margen/))*2+(W(ag)>=40?6:W(ag)>=25?3:0)+Math.min(6,cn)+(X(ag,/\bia\b|inteligencia artificial|baseline|estándar/)?2:0)+(X(ag,/supera|mejor|a diferencia|mientras|ventaja|porque/)?2:0);
return c.map((v,i)=>Math.round(Math.min(v,[30,25,25,20][i])*10)/10)}
function tick(){const r=Math.max(0,S.end-Date.now()),e=document.getElementById("cd");if(e)e.textContent=String(Math.floor(r/60000)).padStart(2,"0")+":"+String(Math.floor(r/1000)%60).padStart(2,"0");if(!r&&typeof S.ph=="number"&&S.ph>0&&S.ph<4)fin()}
function fin(){S.ph=S.ph==1?"g2":S.ph==2?"g3":4;save();draw()}
function go(){const t=+document.getElementById("tm").value,n=document.getElementById("nm").value.trim();if(!t||!n){document.getElementById("er").textContent="Elige tu equipo y escribe los nombres de los integrantes.";return}S={tm:t,nm:n,ph:1,end:Date.now()+DUR,a:{}};save();draw()}
async function pw(){let ok=false;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("gia|"+S.ph+"|"+document.getElementById("pw").value.trim().toUpperCase()));ok=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")===PW[S.ph]}catch(e){}if(ok){S.ph=S.ph=="g2"?2:3;S.end=Date.now()+DUR;save();draw()}else document.getElementById("er").textContent="Contraseña incorrecta. Pídela a la profesora."}
function rst(){try{localStorage.removeItem(K)}catch(e){}S={tm:0,nm:"",ph:0,end:0,a:{}};draw()}
function cp(){const e=document.getElementById("dump");e.select();try{document.execCommand("copy")}catch(x){}}
function draw(){clearInterval(tk);const p=S.ph,ap=document.getElementById("app");let h=`<h1>Simulador Turístico: Case Study and Simulation</h1><div class="vs"><span>Simulador estratégico y auditor de evaluación por fases para Administración de Empresas Turísticas</span></div>`;
if(!S.tm)h+=`<div class="c"><p>Tienen 90 minutos: 3 fases de 30 min, cada una con cronómetro. Al terminar el tiempo, la fase se entrega sola. La IA ya jugó: su marcador es <b>${IA.reduce((x,y)=>x+y)}/100</b>. ¿Pueden superarla?</p><label for="tm">Número de equipo</label><select id="tm"><option value="">Elige…</option>${T.map((t,i)=>`<option value="${i+1}">Equipo ${i+1} · ${t.n}</option>`).join("")}</select><label for="nm">Nombres de los integrantes</label><input id="nm"><p class="no s" id="er"></p><button onclick="go()">Comenzar Fase 1</button></div>`;
else if(typeof p=="number"&&p>0&&p<4)h+=`<div class="bar"><b>Equipo ${S.tm} · ${T[S.tm-1].n}</b><span>Fase ${p} de 3 · IA: ${IA.reduce((x,y)=>x+y)}</span><span id="cd">30:00</span></div>${MAT}${[0,P1,P2,P3][p]()}<button onclick="fin()">${p<3?"Entregar fase "+p:"Entregar y ver calificación"}</button><p class="s">No se puede regresar a una fase entregada.</p>`;
else if(typeof p=="string")h+=`<div class="c"><h2>Fase ${p[1]-1} entregada</h2><p>Pidan a la profesora la contraseña para desbloquear la Fase ${p[1]}.</p><label for="pw">Contraseña</label><input id="pw" autocomplete="off"><p class="no s" id="er"></p><button onclick="pw()">Desbloquear</button></div>`;
else{const c=grade(),tot=Math.round(c.reduce((x,y)=>x+y)*10)/10,w=tot>=IA.reduce((x,y)=>x+y),nm=["Diagnóstico financiero y PESTEL","Prospectiva y gestión de riesgos","Clasificación estratégica y objetivos SMART","Criterio directivo y resiliencia vs IA"],mx=[30,25,25,20];let hs=0;const code="T"+S.tm+"-"+(()=>{for(const ch of S.tm+"|"+tot+"|"+S.nm)hs=(hs*31+ch.charCodeAt(0))>>>0;return hs.toString(36).toUpperCase().slice(0,5)})();
const dump=Object.keys(S.a).map(k=>k+": "+(SL[k]&&S.a[k]!==""?SL[k][+S.a[k]]:S.a[k])).join("\n");
h+=`<div class="c"><b>Equipo ${S.tm} · ${T[S.tm-1].n}</b><p class="s">${esc(S.nm)}</p><div class="sc ${w?"ok":"no"}">${tot}<span class="s"> / 100</span></div><h2 class="${w?"ok":"no"}">${w?"¡El equipo vence a la IA!":"La IA mantiene el liderazgo"}</h2><p>Calificación sobre 10: <b>${(tot/10).toFixed(1)}</b> · Marcador de la IA: ${IA.reduce((x,y)=>x+y)}</p><table>${nm.map((x,i)=>`<tr><td>${x}</td><td>${c[i]} / ${mx[i]}</td><td class="s">IA: ${IA[i]}</td></tr>`).join("")}</table><p>Código de verificación: <b>${code}</b></p><p class="s">Toma una captura de pantalla de esta pantalla y compártela en Drive.</p></div><div class="c"><b>Respuestas del equipo</b><textarea id="dump" rows="8" readonly>${esc(dump)}</textarea><button onclick="cp()">Copiar respuestas</button></div>`}
h+=`<p class="s"><a href="#" onclick="rst();return false" style="color:var(--mut)">Reiniciar (solo profesora)</a></p>`;ap.innerHTML=h;if(typeof p=="number"&&p>0&&p<4){tick();tk=setInterval(tick,1000)}}
draw();
</script></body></html>
